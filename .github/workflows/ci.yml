name: CI

# Default the workflow token to read-only; jobs that need more (e.g.
# prerelease publishing) declare their own permissions block.
permissions:
    contents: read

on:
    push:
        # Trunk branches only. Feature branches are validated by the
        # pull_request runs — with '**' here, every push to a branch
        # with an open PR ran the full ci+bench cycle twice.
        branches:
            - main
            - certification
        tags:
            - 'alpha'
            - 'alpha-*'
            - 'beta'
            - 'beta-*'
            # Certification submission tags (fully numeric 4-part, e.g.
            # 2.0.0.1). Actions glob syntax cannot express "exactly four
            # numeric parts", so the `submission` job re-validates the
            # shape and fails fast on anything else.
            - '[0-9]*.[0-9]*.[0-9]*.[0-9]*'
    pull_request:

jobs:
    ci:
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Use CI .env file
              run: cp .env.ci .env
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
            - name: Cache turbo build setup
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-
            - name: Install Packages
              run: npm ci
            - name: Build packages
              run: npm run build
            - name: Check Package Versions are in Sync
              run: npm run validate-packages-sync
            - name: Validate Current Configuration (deneb-config.json)
              run: npm run validate-config-for-commit
            - name: Linting Checks
              run: npm run eslint
            - name: Prettier Checks
              run: npm run prettier-check
            - name: Tests
              run: npm run test
            - name: Tests (benchmarks compare script)
              run: npm run test:benchmarks
            - name: Confirm pbiviz package (AppSource Version)
              run: npm run package

    bench:
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        needs: ci
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Use CI .env file
              run: cp .env.ci .env
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
            - name: Cache turbo build setup
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-
            - name: Install Packages
              run: npm ci
            - name: Build packages
              run: npm run build
            - name: Run benchmarks and compare
              id: bench
              shell: bash
              continue-on-error: true
              run: |
                  set +e
                  npm run bench
                  # A bench crash leaves no results file → compare.mjs
                  # hits ENOENT and exits 2 (script error), which the
                  # "Fail on script error" step catches. No need to check
                  # bench's own exit code separately.
                  npm run bench:compare
                  DATA_CORE_EXIT=$?
                  echo "data_core_compare_exit=$DATA_CORE_EXIT" >> "$GITHUB_OUTPUT"
                  # app-core runs with its own baseline. Advisory until a
                  # real baseline lands (current baseline is a bootstrap
                  # placeholder — compare.mjs returns 3 until replaced).
                  node benchmarks/compare.mjs --package app-core --format json
                  APP_CORE_EXIT=$?
                  echo "app_core_compare_exit=$APP_CORE_EXIT" >> "$GITHUB_OUTPUT"
                  # Aggregate worst exit code for the downstream guards.
                  # Priority: 2 (error) > 1 (regression) > everything else.
                  COMPARE_EXIT=0
                  for code in "$DATA_CORE_EXIT" "$APP_CORE_EXIT"; do
                    if [ "$code" = "2" ]; then COMPARE_EXIT=2; break; fi
                    if [ "$code" = "1" ] && [ "$COMPARE_EXIT" != "2" ]; then COMPARE_EXIT=1; fi
                  done
                  echo "compare_exit=$COMPARE_EXIT" >> "$GITHUB_OUTPUT"
                  exit 0
            - name: Upload bench results artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bench-results-${{ github.sha }}
                  path: |
                      packages/data-core/benchmarks/results/data-core.json
                      packages/app-core/benchmarks/results/app-core.json
                  retention-days: 14
                  if-no-files-found: warn
            - name: Fail on script error
              if: steps.bench.outputs.compare_exit == '2'
              run: |
                  echo "::error::Benchmark comparison script failed (compare_exit=${{ steps.bench.outputs.compare_exit }}, data-core=${{ steps.bench.outputs.data_core_compare_exit }}, app-core=${{ steps.bench.outputs.app_core_compare_exit }}). A bench crash produces ENOENT in compare.mjs which exits 2. See 'Run benchmarks and compare' step for details."
                  exit 1
            # app-core stays advisory: its dataset-search flag-label
            # benchmark has shown ~47% swings on unchanged code, so a
            # hard gate would produce false-red CI. Promote it only
            # after a per-benchmark threshold override or a stable
            # refreshed baseline lands (see #623). This step runs
            # before the data-core gate so the warning still surfaces
            # when both packages regress.
            - name: Flag app-core regression (advisory)
              if: steps.bench.outputs.app_core_compare_exit == '1'
              continue-on-error: true
              run: |
                  echo "::warning::app-core benchmark regression detected — see comparison table in the 'Run benchmarks and compare' step. app-core benchmarks are advisory and do NOT block merges (#623)."
                  exit 1
            - name: Fail on data-core regression
              if: steps.bench.outputs.data_core_compare_exit == '1'
              run: |
                  echo "::error::data-core benchmark regression detected — see comparison table in the 'Run benchmarks and compare' step. data-core bench regressions block merges (#623). If the regression is an accepted trade-off, refresh the baseline via the bench-update-baseline workflow."
                  exit 1

    prerelease:
        if: startsWith(github.ref, 'refs/tags/alpha') || startsWith(github.ref, 'refs/tags/beta')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            # Derive the release channel from the moving tag name
            # ('alpha'/'beta', including 'alpha-*'/'beta-*' variants).
            # Every later step keys off these outputs, so alpha and
            # beta cannot drift apart.
            - name: Resolve release channel
              id: channel
              run: |
                  CHANNEL="${GITHUB_REF_NAME%%-*}"
                  case "$CHANNEL" in
                      alpha|beta) ;;
                      *)
                          echo "::error::Unsupported prerelease channel '$CHANNEL' (from tag '$GITHUB_REF_NAME')."
                          exit 1
                          ;;
                  esac
                  echo "name=$CHANNEL" >> $GITHUB_OUTPUT
                  echo "prefix=$(echo "$CHANNEL" | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
                  echo "title=${CHANNEL^}" >> $GITHUB_OUTPUT
                  echo "Channel: $CHANNEL"
            # The moving channel tag must be accompanied by a versioned
            # channel tag (e.g. `2.0.0.alpha-2`, `2.0.0.beta-1`) on the
            # same commit — it names the published .pbiviz and the
            # release title. Fail fast (before install/build) if it is
            # missing.
            - name: Resolve versioned channel tag
              id: version_tag
              run: |
                  # `|| true`: keep a no-match grep from failing the
                  # assignment if this step ever runs under pipefail
                  # (e.g. an explicit `shell: bash`), so the guard below
                  # prints its instructions instead of a bare exit.
                  VERSION_TAG=$(git tag --points-at HEAD | grep -E "^[0-9]+\.[0-9]+\.[0-9]+\.${{ steps.channel.outputs.name }}-[0-9]+$" | sort -V | tail -n 1 || true)
                  if [ -z "$VERSION_TAG" ]; then
                      echo "::error::No versioned ${{ steps.channel.outputs.name }} tag (e.g. 2.0.0.${{ steps.channel.outputs.name }}-1) found on this commit. Tag the commit with '<major>.<minor>.<patch>.${{ steps.channel.outputs.name }}-<n>' and re-push the '${{ steps.channel.outputs.name }}' tag to release."
                      exit 1
                  fi
                  echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
                  echo "Versioned channel tag: $VERSION_TAG"
            - name: Use CI .env file
              run: cp .env.ci .env
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
            - name: Cache turbo build setup
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-
            - name: Install Packages
              run: npm ci
            - name: Build packages
              run: npm run build
            # Guard the published artifact against a tampered `.env.ci`.
            # The channel package scripts (`package-alpha`/`package-beta`)
            # deliberately skip the validator locally so that maintainers
            # can produce one-off debug builds (e.g. with
            # ALLOW_EXTERNAL_URI=true) for issue triage. CI does not need
            # that flexibility — anything published to a GitHub release
            # under a prerelease tag must satisfy the same configuration
            # invariants as the certified `package` script. Running the
            # validator here asserts that the on-disk `.env` (copied from
            # `.env.ci` above) holds the approved safe values before the
            # package script bakes them into the artifact.
            #
            # See https://github.com/deneb-viz/deneb/issues/651.
            - name: Validate CI configuration before prerelease packaging
              run: npm run validate-config-for-commit
            - name: Build channel package
              run: npm run package-${{ steps.channel.outputs.name }}
            # mv fails the job if the glob matches zero or multiple
            # files, so a missing/ambiguous build artifact is caught here
            # rather than publishing a mis-named release.
            - name: Rename package to versioned channel filename
              run: mv dist/${{ steps.channel.outputs.prefix }}*.pbiviz "dist/deneb.${{ steps.version_tag.outputs.tag }}.pbiviz"
            - name: Delete existing channel release
              # $GITHUB_REF_NAME (env var, quoted) rather than
              # ${{ github.ref_name }}: expression interpolation pastes
              # the tag name into the script as shell source, so a
              # crafted tag matching 'alpha-*'/'beta-*' (git permits $,
              # parens, semicolons in ref names) could execute commands
              # with the write-capable GITHUB_TOKEN. The env var form is
              # expanded by the shell as data, never parsed as code.
              run: gh release delete "$GITHUB_REF_NAME" --yes || true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Fetch all tags
              run: git fetch --tags --force
            - name: Get last release tag
              id: last_tag
              # Only pure 4-part numeric tags (e.g. 1.9.1.0) are releases
              # cut from main. Positively match that shape so prerelease
              # tags from ANY channel (2.0.0.alpha-2, 2.0.0.beta-1, ...)
              # can never become the changelog baseline — the drift is
              # always measured from the last regular build.
              run: |
                  LAST_TAG=$(git tag -l '[0-9]*' --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
                  echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT
                  echo "Last versioned tag: $LAST_TAG"
            - name: Generate changelog
              id: changelog
              uses: requarks/changelog-action@v1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fromTag: ${{ github.ref_name }}
                  toTag: ${{ steps.last_tag.outputs.tag }}
                  excludeTypes: ''
                  writeToFile: false
            - name: Create channel pre-release
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: true
                  name: '${{ steps.channel.outputs.title }} Channel: Latest Build (${{ steps.version_tag.outputs.tag }})'
                  body: |
                      Deneb ${{ steps.channel.outputs.title }} Channel build, which is the latest release candidate for early adopters.

                      Please refer to the [Early Access Builds](https://deneb-viz.github.io/community/early-access) page on the Deneb website for information on usage and installation.

                      The list of changes should be present in the [Change Log in the 'canary' version](https://deneb-viz.github.io/docs/next/changelog) of the documentation on the Deneb website.

                      The .pbiviz file below needs to be manually installed and is not tied to the AppSource version. **It is not supported for production use and is intended for the purposes of testing and feedback only**.

                      For any issues you create, please ensure to specify the exact version number you are using. Again, please refer to the [Early Access Builds](https://deneb-viz.github.io/community/early-access#providing-feedback-on-early-access-builds) page for information on how to do this.

                      ---

                      ## Changes since ${{ steps.last_tag.outputs.tag }}

                      ${{ steps.changelog.outputs.changes }}
                  files: |
                      dist/deneb.${{ steps.version_tag.outputs.tag }}.pbiviz
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    submission:
        # Certified AppSource build for a certification submission tag.
        # Uploads the .pbiviz as a workflow artifact only — deliberately
        # no release object: submission tags are throwaway remediation
        # iterations and the tag itself is the durable record. The
        # approved tag is later published via the Release workflow.
        if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/alpha') && !startsWith(github.ref, 'refs/tags/beta') }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
            # The tag names the artifact that gets submitted to Partner
            # Center, so it must be the exact version baked into the
            # package. Fail fast (before install/build) on a shape or
            # version mismatch.
            - name: Validate submission tag against pbiviz.json
              run: |
                  if ! echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::Tag '$GITHUB_REF_NAME' is not a 4-part numeric submission tag (e.g. 2.0.0.1)."
                      exit 1
                  fi
                  PBIVIZ_VERSION=$(node -p "require('./pbiviz.json').visual.version")
                  if [ "$GITHUB_REF_NAME" != "$PBIVIZ_VERSION" ]; then
                      echo "::error::Tag '$GITHUB_REF_NAME' does not match pbiviz.json visual.version '$PBIVIZ_VERSION'. Bump pbiviz.json, commit, and re-tag."
                      exit 1
                  fi
            - name: Use CI .env file
              run: cp .env.ci .env
            - name: Cache turbo build setup
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-
            - name: Install Packages
              run: npm ci
            - name: Build packages
              run: npm run build
            # `npm run package` runs validate-config-for-commit itself,
            # so the tampered-.env.ci guard from the prerelease job is
            # inherent here.
            - name: Build certified (AppSource) package
              run: npm run package
            # mv fails the job if the glob matches zero or multiple
            # files, so a missing/ambiguous build artifact is caught here
            # rather than uploading a mis-named artifact.
            - name: Rename package to submission filename
              run: mv dist/deneb7E15AEF80B9E4D4F8E12924291ECE89A*.pbiviz "dist/deneb.${GITHUB_REF_NAME}.pbiviz"
            - name: Upload submission artifact
              uses: actions/upload-artifact@v4
              with:
                  name: deneb.${{ github.ref_name }}
                  path: dist/deneb.${{ github.ref_name }}.pbiviz
                  retention-days: 90
                  if-no-files-found: error
